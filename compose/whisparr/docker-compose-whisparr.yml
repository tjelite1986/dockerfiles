services:
  whisparr:
    container_name: whisparr
    image: ghcr.io/hotio/whisparr
    restart: unless-stopped
    networks:
      - $NETWORKS
    ports:
      - 6969:6969
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - UMASK=002
    volumes:
      - $DATADIR/whisparr:/config
      - /mnt:/mnt
    labels:
      - "traefik.enable=true"
      # Router för HTTPS
      - "traefik.http.routers.whisparr-secure.rule=Host(`whisparr.$DOMAIN`)"
      - "traefik.http.routers.whisparr-secure.entrypoints=https"
      - "traefik.http.routers.whisparr-secure.tls=true"
      - "traefik.http.routers.whisparr-secure.tls.certresolver=cloudflare" # Använder din Cloudflare certifikatutfärdare
      - "traefik.http.routers.whisparr-secure.service=whisparr-service" # Namn på tjänsten nedan

      # Definiera tjänsten som routern ska peka på
      - "traefik.http.services.whisparr-service.loadbalancer.server.port=6969" # Sonarrs interna port

      # Middleware för att lägga till X-Forwarded-Proto header (bra om Sonarr ligger bakom en proxy)
      - "traefik.http.routers.whisparr-secure.middlewares=sslheader@docker" # Använder samma sslheader middleware som du definierat för Traefik
