services:
### is a self-deployable file hosting service for sending out red teaming payloads or securely sharing your private files over HTTP and WebDAV.
  pwndrop:
    image: lscr.io/linuxserver/pwndrop:latest
    container_name: pwndrop
    restart: unless-stopped
    networks:
      - $NETWORKS
    ports:
      - 8085:8080
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: /pwndrop #optional
    volumes:
      - $DATADIR/pwndrop:/config
    labels:
      - "traefik.enable=true"
      # Router för HTTPS
      - "traefik.http.routers.pwndrop-secure.rule=Host(`pwndrop.$DOMAIN`)"
      - "traefik.http.routers.pwndrop-secure.entrypoints=https"
      - "traefik.http.routers.pwndrop-secure.tls=true"
      - "traefik.http.routers.pwndrop-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.pwndrop-secure.service=pwndrop-service"
      - "traefik.http.services.pwndrop-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.pwndrop-secure.middlewares=sslheader@docker"
    
