services:
  deluge:
    container_name: deluge
    image: lscr.io/linuxserver/deluge:latest
    restart: unless-stopped
    networks:
      - $NETWORKS
    ports:
      - 8112:8112
      - 6881:6881
      - 6881:6881/udp
      - 58846:58846 #optional
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - DELUGE_LOGLEVEL=error #optional
    volumes:
      - $DATADIR/deluge:/config
      - $DOWNLOADSDIR/torrent:/downloads
    labels:
      - "traefik.enable=true"
      # Router för HTTPS
      - "traefik.http.routers.deluge-secure.rule=Host(`deluge.$DOMAIN`)"
      - "traefik.http.routers.deluge-secure.entrypoints=https"
      - "traefik.http.routers.deluge-secure.tls=true"
      - "traefik.http.routers.deluge-secure.tls.certresolver=cloudflare" # Använder din Cloudflare certifikatutfärdare
      - "traefik.http.routers.deluge-secure.service=deluge-service" # Namn på tjänsten nedan

      # Definiera tjänsten som routern ska peka på
      - "traefik.http.services.deluge-service.loadbalancer.server.port=8112" # Sonarrs interna port

      # Middleware för att lägga till X-Forwarded-Proto header (bra om Sonarr ligger bakom en proxy)
      - "traefik.http.routers.deluge-secure.middlewares=sslheader@docker" # Använder samma sslheader middleware som du definierat för Traefik

    
