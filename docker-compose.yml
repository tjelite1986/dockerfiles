########################### NETWORKS
networks:
  default:
    driver: bridge
  proxnet:
    name: proxnet
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.69.0/24
include:        
  ### SERVICES ###
  - $DOCKERDIR/traefik/docker-compose-traefik.yml
  - $DOCKERDIR/compose/navidrome/docker-compose-navidrome.yml
  - $DOCKERDIR/compose/homer/docker-compose-homer.yml
  - $DOCKERDIR/compose/metube/docker-compose-metube.yml
  - $DOCKERDIR/compose/filebrowser/docker-compose-filebrowser.yml
  - $DOCKERDIR/compose/pwndrop/docker-compose-pwndrop.yml
